[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vayu-agi"
version = "6.1.0"
description = "A local-first, inspectable cognitive architecture"
requires-python = ">=3.10"

[project.scripts]
vayu = "vayu_agi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]